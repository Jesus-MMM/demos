<header class="site-header">
  <div class="header-inner">
    <div class="header-left">
      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle navigation" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <a href="{{base}}/" class="brand">
        <svg class="brand-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="32" height="32" role="img" aria-label="DemOS app icon">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0e3b2a"/>
            <stop offset="1" stop-color="#062519"/>
          </linearGradient>
          <linearGradient id="d" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#4ade80"/>
            <stop offset="1" stop-color="#22c55e"/>
          </linearGradient>
        </defs>

        <!-- Fondo -->
        <rect width="512" height="512" rx="115" fill="url(#bg)"/>

        <!-- Letra D -->
        <path d="M173 150 L233 150 A106 106 0 0 1 233 362 L173 362"
              fill="none" stroke="url(#d)" stroke-width="36"
              stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Prompt > -->
        <path d="M218 215 L253 256 L218 297"
              fill="none" stroke="#a7f3d0" stroke-width="20"
              stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Cursor parpadeante -->
        <line x1="269" y1="297" x2="296" y2="297"
              stroke="#a7f3d0" stroke-width="20" stroke-linecap="round">
          <animate attributeName="opacity" values="1;0" dur="1.1s"
                   calcMode="discrete" repeatCount="indefinite"/>
        </line>
      </svg>
        <span class="brand-text">{{site.title}}</span>
      </a>
    </div>

    <div class="header-search">
      <div class="search-box">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" id="navSearch" placeholder="Search docs..." aria-label="Search documentation" autocomplete="off" />
        <kbd class="search-kbd">/</kbd>
      </div>
    </div>

    <div class="header-right">
      <a href="https://github.com/Jesus-MMM/demos" class="header-icon-link" aria-label="GitHub repository" target="_blank" rel="noopener">
        <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
      </a>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle theme">
        <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </div>
</header>
